<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GitHub宝藏盲盒</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">GitHub宝藏盲盒</div>
    <div class="sub">点一下，抽一个值得收藏的开源项目</div>
  </header>

  <div class="chips" id="chips"></div>

  <div class="stage">
    <div class="box" id="box">
      <div class="box-lid"></div>
      <div class="box-body"><span class="q">?</span></div>
    </div>

    <div class="card hidden" id="card">
      <div class="card-top">
        <span class="tag" id="cTag">AI</span>
        <span class="lic" id="cLic">MIT</span>
      </div>
      <div class="name" id="cName">owner/repo</div>
      <div class="desc" id="cDesc"></div>
      <div class="row"><span class="k">适合谁</span><span class="v" id="cWho"></span></div>
      <div class="row"><span class="k">Star</span><span class="v" id="cStar"></span></div>
      <div class="link">
        <div class="k">项目地址</div>
        <div class="url" id="cUrl">github.com/owner/repo</div>
        <div class="hint">在浏览器打开，或在 GitHub 搜索仓库名</div>
      </div>
    </div>
  </div>

  <button class="btn" id="draw" type="button">抽一个盲盒</button>
  <div class="actions">
    <button class="ghost" id="save" type="button">保存卡片到相册</button>
  </div>
  <div class="count" id="count"></div>

  <footer>
    只收录采用开源许可证的正版项目，使用前请阅读各项目许可证。<br>
    Star 数据截至 <span id="asof"></span>，以 GitHub 页面为准。
  </footer>
</div>
<canvas id="cv" width="1080" height="1440" class="hidden"></canvas>
<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
